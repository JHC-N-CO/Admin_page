<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>거절 사유</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/decline_reason.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-times-circle"></i> 참가 거절</h1>
        </div>
        
        <div class="content">
            <div class="participant-info">
                <h2>참가자: {{ participant_name }}</h2>
            </div>
            
            <div class="reason-section">
                <h3><i class="fas fa-comment-alt"></i> 거절 사유</h3>
                <div class="reason-content">
                    {% if reason %}
                        <p>{{ reason }}</p>
                    {% else %}
                        <p class="no-reason">거절 사유가 입력되지 않았습니다.</p>
                    {% endif %}
                </div>
            </div>
            
            <div class="actions">
                <button type="button" class="btn btn-primary" onclick="window.close()">
                    <i class="fas fa-times"></i> 닫기
                </button>
            </div>
        </div>
    </div>
</body>
</html>
