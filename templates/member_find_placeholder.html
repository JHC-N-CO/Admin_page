<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/member_auth.css') }}">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">

            <div class="auth-actions">
                <a href="{{ url_for('member_login') }}" class="btn btn-primary btn-block">로그인으로 돌아가기</a>
            </div>
        </div>
    </div>
</body>
</html>
