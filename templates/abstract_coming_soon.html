<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초록 제출 - {{ event.name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/member_auth.css') }}">
</head>
<body>

        <div class="auth-card">
            <div class="auth-header">
                <h1>초록 제출</h1>
                <p>{{ event.name }}</p>

            <a href="{{ url_for('abstract_hub', event_id=event.id) }}" class="btn btn-secondary btn-block">안내 화면으로</a>
        </div>
    </div>

</html>
