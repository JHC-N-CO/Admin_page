<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - 가입확인</title>
    <link rel="stylesheet" href="/static/css/register_step1.css">
</head>
<body>
    <div class="stepbar-wrap">
        <div class="step-bar">
            <div class="step active">
                <span class="step-num">STEP 01</span>
                <span class="step-label">가입확인</span>
            </div>
            <div class="step">
                <span class="step-num">STEP 02</span>
                <span class="step-label">약관동의</span>
            </div>
            <div class="step">
                <span class="step-num">STEP 03</span>
                <span class="step-label">회원정보 입력</span>
            </div>
            <div class="step">
                <span class="step-num">STEP 04</span>
                <span class="step-label">가입완료</span>
            </div>
        </div>
    </div>
    <div class="main-flex">
        <div class="container">
            <div class="header">
                <h1>회원가입</h1>
                <p>아래 정보를 입력하여 회원가입을 진행하세요.</p>
            </div>
            
            <div class="form-container">
                {% if error %}
                <div class="error-message">
                    {{ error }}
                </div>
                {% endif %}
                
                <div class="info-box">
                    이름과 이메일로 기존 회원 여부를 확인합니다.
                </div>
                
                <form action="/register/step1" method="post">
                    <div class="form-section">
                        <div class="form-group">
                            <label for="name_kor" class="required">이름 (한글)</label>
                            <input type="text" id="name_kor" name="name_kor" required 
                                   value="{{ request.args.get('name_kor', '') }}" placeholder="홍길동">
                        </div>
                        <div class="form-group">
                            <label for="email" class="required">이메일</label>
                            <input type="email" id="email" name="email" required 
                                   value="{{ request.args.get('email', '') }}" placeholder="example@email.com">
                        </div>
                    </div>
                    
                    <div class="navigation-buttons">
                        <button type="submit" class="btn btn-primary">다음 단계</button>
                    </div>
                </form>
                
                <div class="additional-links">
                    <p>이미 회원이신가요?</p>
                    <div class="link-buttons">
                        <a href="/member/login" class="btn btn-secondary">로그인</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="/static/js/register_step1.js"></script>
</body>
</html>
