<!DOCTYPE html>
<html>
<head>
    <title>Compose Email</title>
    <link rel="stylesheet" href="../static/css/compose_email.css">
</head>
<body>
    <div class="container">
        <h1>Compose Email</h1>
        <form action="/send_email" method="post" onsubmit="sendEmail(event)">
            <input type="hidden" name="participant_ids" value="{{ participant_ids }}">
            <input type="hidden" name="body" id="body">
            <input type="text" name="subject" placeholder="Subject" required>
            <div id="editor" class="editor" contenteditable="true" placeholder="Compose your email here..."></div>
            <input type="text" name="cc" class="cc-input" placeholder="CC (comma-separated email addresses)">
            <label class="checkbox-label">
                <input type="checkbox" name="include_buttons" value="yes"> Include Accept/Decline buttons
            </label>
            <button type="submit">Send Email</button>
            <div id="loading" class="loading-container">
                <span id="loading-icon" class="spinner"></span>
                <span id="loading-text">이메일 발송 중...</span>
            </div>
        </form>
    </div>
    <script src="../static/js/compose_email.js"></script>
</body>
</html>
