<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>컬럼 선택 - 회원 Excel 내보내기</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/select_columns.css') }}">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">회원 Excel 내보내기 설정</h1>
            <p class="subtitle">내보낼 컬럼을 선택하세요</p>
        </header>

        <form id="exportForm" action="/download_members_excel" method="POST">
            <input type="hidden" name="selected_members" value="{{ members }}">
            
            <div class="section">
                <h2 class="section-title">컬럼 선택</h2>
                <div class="column-controls">
                    <button type="button" id="selectAll" class="btn btn-secondary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 11l3 3L22 4"></path>
                            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                        </svg>
                        전체 선택
                    </button>
                    <button type="button" id="clear" class="btn btn-secondary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="9" y1="9" x2="15" y2="15"></line>
                            <line x1="15" y1="9" x2="9" y2="15"></line>
                        </svg>
                        전체 해제
                    </button>
                </div>
                
                <div class="column-list">
                    <!-- 표준 컬럼 순서대로 표시 -->
                    <label class="column-item">
                        <input type="checkbox" name="selected_columns" value="아이디" checked>
                        <span class="checkmark"></span>
                        <span class="column-name">아이디</span>
                    </label>
                    <label class="column-item">
                        <input type="checkbox" name="selected_columns" value="성별" checked>
                        <span class="checkmark"></span>
                        <span class="column-name">성별</span>
                    </label>
                    <label class="column-item">
                        <input type="checkbox" name="selected_columns" value="성명(KOR)" checked>
                        <span class="checkmark"></span>
                        <span class="column-name">성명(KOR)</span>
                    </label>
                    <label class="column-item">
                        <input type="checkbox" name="selected_columns" value="성명(ENG)" checked>
                        <span class="checkmark"></span>
                        <span class="column-name">성명(ENG)</span>
                    </label>
                    <label class="column-item">
                        <input type="checkbox" name="selected_columns" value="이름(First Name)" checked>
                        <span class="checkmark"></span>
                        <span class="column-name">이름(First Name)</span>
                    </label>
                    <label class="column-item">
                        <input type="checkbox" name="selected_columns" value="성(Last Name)" checked>
                        <span class="checkmark"></span>
                        <span class="column-name">성(Last Name)</span>
                    </label>
                    <label class="column-item">
                        <input type="checkbox" name="selected_columns" value="이메일" checked>
                        <span class="checkmark"></span>
                        <span class="column-name">이메일</span>
                    </label>
                    <label class="column-item">
                        <input type="checkbox" name="selected_columns" value="전화" checked>
                        <span class="checkmark"></span>
                        <span class="column-name">전화</span>
                    </label>
                    <label class="column-item">
                        <input type="checkbox" name="selected_columns" value="소속(ENG)" checked>
                        <span class="checkmark"></span>
                        <span class="column-name">소속(ENG)</span>
                    </label>
                    <label class="column-item">
                        <input type="checkbox" name="selected_columns" value="과(ENG)" checked>
                        <span class="checkmark"></span>
                        <span class="column-name">과(ENG)</span>
                    </label>
                    <label class="column-item">
                        <input type="checkbox" name="selected_columns" value="소속(KOR)" checked>
                        <span class="checkmark"></span>
                        <span class="column-name">소속(KOR)</span>
                    </label>
                    <label class="column-item">
                        <input type="checkbox" name="selected_columns" value="과(KOR)" checked>
                        <span class="checkmark"></span>
                        <span class="column-name">과(KOR)</span>
                    </label>
                    <label class="column-item">
                        <input type="checkbox" name="selected_columns" value="직위" checked>
                        <span class="checkmark"></span>
                        <span class="column-name">직위</span>
                    </label>
                    <label class="column-item">
                        <input type="checkbox" name="selected_columns" value="면허번호" checked>
                        <span class="checkmark"></span>
                        <span class="column-name">면허번호</span>
                    </label>
                    <label class="column-item">
                        <input type="checkbox" name="selected_columns" value="생년월일" checked>
                        <span class="checkmark"></span>
                        <span class="column-name">생년월일</span>
                    </label>
                    <label class="column-item">
                        <input type="checkbox" name="selected_columns" value="회원구분" checked>
                        <span class="checkmark"></span>
                        <span class="column-name">회원구분</span>
                    </label>
                </div>
            </div>

            <div class="section">
                <h2 class="section-title">내보내기</h2>
                <div class="export-buttons">
                    <button type="submit" class="btn btn-primary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7,10 12,15 17,10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        Excel 다운로드
                    </button>
                </div>
            </div>
        </form>
    </div>

    <script src="{{ url_for('static', filename='js/select_columns_members.js') }}"></script>
</body>
</html>
