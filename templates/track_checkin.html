<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>참가자 출결관리</title>
    <link rel="stylesheet" href="../static/css/track_checkin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body data-event-id="{{ event.id }}">
    <div class="checkin-hero">
        <div class="checkin-icon">
            <i class="fa-solid fa-circle-check"></i>
        </div>
        <h1 class="checkin-title">참가자 출결관리</h1>
        <div class="checkin-subtitle">출석 체크</div>
        <div class="checkin-desc">참가자 코드를 입력하거나 바코드를 스캔하세요</div>
    </div>
    <div class="container">
        <div class="main">
            <div class="input-section">
                <input 
                    type="text" 
                    id="barcodeInput" 
                    placeholder="Code or Barcode Scan" 
                    autofocus
                    autocomplete="off"
                >
            </div>
            <div class="input-hint">참가자 고유 코드를 정확히 입력해주세요</div>
            <div class="result-section" id="resultSection" style="display: none;">
                <div class="participant-info">
                    <h3 id="participantName">참가자명</h3>
                    <div class="attendance-info">
                        <div class="info-row">
                            <span class="label">체크인:</span>
                            <span class="time" id="checkInTime">-</span>
                        </div>
                        <div class="info-row">
                            <span class="label">체크아웃:</span>
                            <span class="time" id="checkOutTime">-</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="../static/js/track_checkin.js"></script>
</body>
</html>
