<!DOCTYPE html>
<html>
<head>
    <title>Add Participant</title>
    <link rel="stylesheet" href="../static/css/add_participant.css">
</head>
<body>
    <div class="container">
        <h1>Add Participant</h1>
        
        {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
        {% endif %}
        
        <form action="/add_participant/{{ event.id }}" method="post" enctype="multipart/form-data" onsubmit="submitForm(event)">
            
            <div class="form-group">
                <label for="registration">Registration</label>
                <select id="registration" name="registration" option>
                    <option value="" disabled selected>선택하세요</option>
                    <option value="사전등록">사전등록</option>
                    <option value="현장등록">현장등록</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="division">Division</label>
                <select id="division" name="division" option>
                    <option value="" disabled selected>선택하세요</option>
                    <option value="전공의">전공의</option>
                    <option value="전문의">전문의</option>
                    <option value="기타">기타</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="role">Role</label>
                <select id="role" name="role" option>
                    <option value="" disabled selected>선택하세요</option>
                    <option value="좌장">좌장</option>
                    <option value="연자">연자</option>
                    <option value="기타">기타</option>
                </select>
            </div>

            <div class="form-group">
                <label for="country">Country</label>
                <input type="text" id="country" name="country" placeholder="Enter country" option>
            </div>

            <div class="form-group">
                <label for="name_kor">Name (Korean)</label>
                <input type="text" id="name_kor" name="name_kor" placeholder="Enter name in Korean" option>
            </div>

            <div class="form-group">
                <label for="affiliation_kor">Affiliation (Korean)</label>
                <input type="text" id="affiliation_kor" name="affiliation_kor" placeholder="Enter affiliation in Korean" option>
            </div>

            <div class="form-group">
                <label for="department_kor">Department (Korean)</label>
                <input type="text" id="department_kor" name="department_kor" placeholder="Enter department in Korean" option>
            </div>

            <div class="form-group">
                <label for="first_name">First Name</label>
                <input type="text" id="first_name" name="first_name" placeholder="Enter first name" option>
            </div>

            <div class="form-group">
                <label for="family_name">Family Name</label>
                <input type="text" id="family_name" name="family_name" placeholder="Enter family name" option>
            </div>

            <div class="form-group">
                <label for="affiliation_eng">Affiliation (English)</label>
                <input type="text" id="affiliation_eng" name="affiliation_eng" placeholder="Enter affiliation in English" option>
            </div>

            <div class="form-group">
                <label for="department_eng">Department (English)</label>
                <input type="text" id="department_eng" name="department_eng" placeholder="Enter department in English" option>
            </div>

            <div class="form-group">
                <label>Accept or Decline</label>
                <div>
                    <input type="radio" id="accept" name="accept_or_decline" value="Accept">
                    <label for="accept">Accept</label>
                </div>
                <div>
                    <input type="radio" id="decline" name="accept_or_decline" value="Decline">
                    <label for="decline">Decline</label>
                </div>
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter email" option>
            </div>

            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="text" id="phone" name="phone" placeholder="Enter phone number" option>
            </div>

            <div class="form-group">
                <label for="position">Position</label>
                <input type="text" id="position" name="position" placeholder="Enter position" option>
            </div>

            <div class="form-group">
                <label for="license_number">License #</label>
                <input type="text" id="license_number" name="license_number" placeholder="Enter license number" option>
            </div>

            <div class="form-group">
                            <label for="cv">CV</label>
                            <input type="file" id="cv" name="cv" accept=".pdf,.docx">
                        </div>

                        <div class="form-group">
                            <label for="photo">Photo</label>
                            <input type="file" id="photo" name="photo" accept=".png,.jpg,.jpeg">
                        </div>

                        <div class="form-group">
                            <label for="ppt">PPT</label>
                            <input type="file" id="ppt" name="ppt" accept=".ppt,.pptx">
                        </div>

                        <div class="form-group">
                            <label for="script">Script</label>
                            <input type="file" id="script" name="script" accept=".pdf,.docx,.txt">
                        </div>

                        <div class="form-group">
                            <label> Agree</label>
                            <div>
                                <input type="radio" id="agree_yes" name="agree" value="Yes">
                                <label for="agree_yes">Yes</label>
                            </div>
                            <div>
                                <input type="radio" id="agree_no" name="agree" value="No">
                                <label for="agree_no">No</label>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="remark_user">Remark (User)</label>
                            <textarea id="remark_user" name="remark_user" placeholder="Enter user remarks" class="auto-resize"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="remark_admin">Remark (Admin)</label>
                            <textarea id="remark_admin" name="remark_admin" placeholder="Enter admin remarks" class="auto-resize"></textarea>
                        </div>
            <button type="submit">Add Participant</button>
        </form>
    </div>
    <script src="../static/js/add_participant.js"></script>
</body>
</html>
