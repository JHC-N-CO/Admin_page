<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>컬럼 선택 - Excel 내보내기</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/select_columns.css') }}">
    <!-- ZIP 파일 생성을 위한 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">Excel 내보내기 설정</h1>
            <p class="subtitle">내보낼 컬럼을 선택하고 원하는 형식을 지정하세요</p>
        </header>

        <form id="exportForm" action="/download_participants_excel/{{ event_id }}" method="POST">
            <input type="hidden" name="selected_participants" value="{{ participants }}">
            
            <div class="section">
                <h2 class="section-title">컬럼 선택</h2>
                <div class="column-controls">
                    <button type="button" id="selectAll" class="btn btn-secondary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 11l3 3L22 4"></path>
                            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                        </svg>
                        전체 선택
                    </button>
                    <button type="button" id="clear" class="btn btn-secondary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="9" y1="9" x2="15" y2="15"></line>
                            <line x1="15" y1="9" x2="9" y2="15"></line>
                        </svg>
                        전체 해제
                    </button>
                </div>
                
                <div class="column-list">
                    {% for column in columns %}
                    <label class="column-item">
                        <input type="checkbox" name="selected_columns" value="{{ column }}" checked>
                        <span class="checkmark"></span>
                        <span class="column-name">{{ column.replace('_', ' ').title() }}</span>
                    </label>
                    {% endfor %}
                </div>
            </div>

            <div class="section">
                <h2 class="section-title">내보내기 옵션</h2>
                <div class="export-layout-options" style="margin-bottom: 12px;">
                    <label><input type="radio" name="export_layout" value="normal" checked> 일반 방식 (순서대로)</label>
                    <label><input type="radio" name="export_layout" value="odd_even"> 홀수/짝수 분리 방식</label>
                </div>
                <div class="export-buttons">
                    <button type="submit" class="btn btn-primary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7,10 12,15 17,10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        Excel 다운로드
                    </button>
                    
                    <button type="button" id="qrExportBtn" class="btn btn-secondary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="7" height="7"></rect>
                            <rect x="14" y="3" width="7" height="7"></rect>
                            <rect x="14" y="14" width="7" height="7"></rect>
                            <rect x="3" y="14" width="7" height="7"></rect>
                        </svg>
                        Excel 다운로드 (QR 코드)
                    </button>
                    
                    <div class="path-selection" style="display: none; margin-top: 10px;">
                        <label for="customPath" class="path-label">저장할 폴더 경로:</label>
                        <input type="text" id="customPath" placeholder="/Users/jhc/Downloads/Excel_QR_Code" class="path-input">
                        <button type="button" id="browsePathBtn" class="btn btn-secondary">폴더 선택</button>
                        <button type="button" id="qrExportWithPathBtn" class="btn btn-primary">실제 경로로 다운로드</button>
                    </div>
                    
                    <button type="button" id="customExportBtn" class="btn btn-secondary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14,2 14,8 20,8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                            <polyline points="10,9 9,9 8,9"></polyline>
                        </svg>
                        Excel 다운로드 (평점신고)
                    </button>
                    
                    <div class="rating-selection" style="display: none; margin-top: 10px;">
                        <label for="ratingCriteria" class="rating-label">평점 기준 선택:</label>
                        <select id="ratingCriteria" class="rating-select">
                            <option value="1">1평점 기준</option>
                            <option value="2">2평점 기준</option>
                            <option value="3">3평점 기준</option>
                            <option value="4">4평점 기준</option>
                            <option value="5">5평점 기준</option>
                            <option value="6" selected>6평점 기준</option>
                        </select>
                        <button type="button" id="confirmRatingBtn" class="btn btn-primary">다운로드</button>
                    </div>
                </div>
            </div>


        </form>
    </div>


        </form>
    </div>

    <!-- eventId 변수를 Flask 템플릿에서 JavaScript로 전달 -->
    <script>
        const eventId = "{{ event_id }}";
    </script>
    <script src="{{ url_for('static', filename='js/select_columns.js') }}"></script>
</body>
</html>
