<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원 로그인</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/member_auth.css') }}">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <h1>회원 로그인</h1>
                <p>학회 회원 아이디와 비밀번호로 로그인해 주세요.</p>
            </div>

            {% if error %}
            <div class="error-message">{{ error }}</div>
            {% endif %}

            <form method="post" action="{{ url_for('member_login') }}" class="auth-form">
                {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
                {% endif %}
                <div class="form-group">
                    <label for="username">아이디</label>
                    <input type="text" id="username" name="username" required
                           autocomplete="username" value="{{ username or '' }}"
                           placeholder="아이디">
                </div>
                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" name="password" required
                           autocomplete="current-password" placeholder="비밀번호">
                </div>
                <button type="submit" class="btn btn-primary btn-block">로그인</button>
            </form>

            <div class="auth-links">
                <a href="{{ url_for('register_step1') }}">회원가입</a>
                <span class="auth-link-sep">|</span>
                <a href="{{ url_for('member_find_id') }}">아이디 찾기</a>
                <span class="auth-link-sep">|</span>
                <a href="{{ url_for('member_find_password') }}">비밀번호 찾기</a>
            </div>
        </div>
    </div>
</body>
</html>
